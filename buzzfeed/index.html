<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS // MATRIX_DISPLAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff0055;
            --bg-deep: #06070d;
            --panel-dark: #0d0e12;
            --border-glow: #1a1d29;
            --text-main: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif;
            height: 100vh; 
            width: 100vw;
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        /* TOP STATUS BAR */
        header {
            height: 45px; 
            background: rgba(13, 14, 18, 0.85); 
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            display: flex; 
            align-items: center; 
            padding: 0 30px; 
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            flex-shrink: 0;
        }

        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* DYNAMIC RESPONSIVE MAIN AREA */
        main {
            flex-grow: 1; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 15px 20px;
            position: relative;
            min-height: 0; /* Prevents flex items from busting containers */
        }

        .screen-unit { 
            width: 100%; 
            max-width: 1200px; /* Increased limit for higher resolution displays */
            height: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }

        /* Dynamic sizing calculated to never push content out of bounds */
        #monitor-box {
            width: 100%; 
            height: calc(100vh - 280px); /* Smart safety margin for header, panel & gallery */
            max-height: calc(1200px * 9 / 16); /* Forces lock on standard 16:9 box scale maximum */
            background: #020204;
            border: 1px solid var(--border-glow); 
            border-radius: 8px;
            overflow: hidden; 
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255,255,255,0.05) inset;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        #display-img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Keeps full uncropped aspect integrity cleanly */
            opacity: 0; 
            transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* LIVE FEED CAPTION */
        .sub-container {
            margin-top: 10px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 0 20px;
            background: linear-gradient(90deg, transparent, rgba(26, 29, 41, 0.2), transparent);
            flex-shrink: 0;
        }

        #subtitle {
            font-size: 16px; 
            color: #fff; 
            font-weight: 500; 
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* INPUT PANEL */
        .console-panel {
            margin-top: 5px; 
            width: 100%; 
            display: flex; 
            gap: 12px;
            padding: 10px; 
            background: var(--panel-dark); 
            border: 1px solid var(--border-glow); 
            border-radius: 6px;
            position: relative;
            flex-shrink: 0;
        }

        .console-input {
            background: #12141c; 
            border: 1px solid #222636; 
            color: #fff;
            padding: 0 16px; 
            height: 42px;
            outline: none; 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            transition: all 0.25s ease;
        }

        .console-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        #prompt-in { flex-grow: 1; }
        .size-in { width: 85px; text-align: center; color: #8a94b3; font-family: 'Orbitron', sans-serif; font-size: 13px;}

        .exe-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #00b0ff); 
            border: none; 
            color: #000;
            padding: 0 25px; 
            cursor: pointer; 
            font-weight: 700;
            font-family: 'Orbitron', sans-serif; 
            font-size: 12px;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }
        .exe-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); 
        }
        .exe-btn:active { transform: translateY(1px); }

        /* UPGRADED BALCONY GALLERY */
        footer {
            height: 120px; 
            background: #090a0e; 
            border-top: 1px solid var(--border-glow);
            display: flex; 
            align-items: center; 
            padding: 0 25px; 
            gap: 16px; 
            overflow-x: auto; 
            overflow-y: hidden;
            flex-shrink: 0;
        }

        footer::-webkit-scrollbar { height: 4px; }
        footer::-webkit-scrollbar-track { background: transparent; }
        footer::-webkit-scrollbar-thumb { background: #222636; border-radius: 2px; }

        .thumb-wrapper {
            position: relative;
            width: 84px; 
            height: 84px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #1a1d29;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            background: #020204;
        }

        .thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.3s ease;
            filter: brightness(0.8);
        }

        .thumb-wrapper:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3);
        }

        .thumb-wrapper:hover .thumb {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        /* Premium HUD Interface Element on Thumbnail */
        .thumb-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
            color: var(--neon-cyan);
            font-size: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .thumb-wrapper:hover .thumb-overlay { opacity: 1; }

        /* FULL SIZE LIGHTBOX OPTIMIZATION */
        #lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 4, 7, 0.9); 
            backdrop-filter: blur(15px); 
            display: none; 
            justify-content: center; align-items: center; 
            z-index: 9999; 
            cursor: zoom-out;
        }

        #lb-img { 
            max-width: 95%; 
            max-height: 90%; 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 40px 90px rgba(0,0,0,0.9);
            border-radius: 6px;
        }

        /* ANIMATIONS & OVERRIDES */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--neon-cyan); }
        }
        .active-sync { animation: pulseGlow 2s infinite ease-in-out; }
    </style>
</head>
<body>

    <header>
        <div class="status-wrapper">
            <div id="status-dot" class="status-dot"></div>
            <div id="status-tag" class="active-sync" style="font-size: 11px; color: var(--neon-cyan); font-weight:700; letter-spacing: 1.5px;">LIVE_FEED_SYNC</div>
        </div>
        <div id="mode-tag" style="font-size: 11px; color: #535b73; font-weight:700;">NEXUS // SYSTEM_OS</div>
    </header>

    <main>
        <div class="screen-unit">
            <div id="monitor-box">
                <img id="display-img" src="" alt="Main Display Stream">
            </div>

            <div class="sub-container">
                <p id="subtitle">READY FOR INTERCEPT...</p>
            </div>

            <div class="console-panel">
                <input type="text" id="prompt-in" class="console-input" placeholder="Enter Generation Directive..." onkeypress="if(event.key==='Enter') generate()">
                <input type="number" id="w-in" class="console-input size-in" placeholder="1280">
                <input type="number" id="h-in" class="console-input size-in" placeholder="720">
                <button class="exe-btn" onclick="generate()">Execute</button>
            </div>
        </div>
    </main>

    <footer id="gallery"></footer>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lb-img" src="" alt="Expanded View">
    </div>

    <script>
        const img = document.getElementById('display-img');
        const sub = document.getElementById('subtitle');
        const statDot = document.getElementById('status-dot');
        const statTag = document.getElementById('status-tag');
        const gallery = document.getElementById('gallery');
        const lbImg = document.getElementById('lb-img');
        const lightbox = document.getElementById('lightbox');
        
        let focusActive = false;
        let es = null;

        function update(url, text) {
            const loader = new Image();
            loader.src = url;
            loader.onload = () => {
                img.style.opacity = '0';
                setTimeout(() => {
                    img.src = url;
                    sub.innerText = text;
                    img.style.opacity = '1';
                }, 150);
            };
        }

        function connect() {
            if (es) es.close();
            es = new EventSource("https://image.pollinations.ai/feed");
            es.onmessage = (e) => {
                if (focusActive) return;
                const data = JSON.parse(e.data);
                if (data.imageURL) update(data.imageURL, data.prompt);
            };
            es.onerror = () => {
                es.close();
                if (!focusActive) {
                    update(`https://picsum.photos/seed/${Math.random()}/1280/720`, "RE-ESTABLISHING LINK MODULE...");
                }
                setTimeout(connect, 5000);
            };
        }

        function generate() {
            const p = document.getElementById('prompt-in').value;
            const w = document.getElementById('w-in').value || 1280;
            const h = document.getElementById('h-in').value || 720;
            if (!p) return;

            focusActive = true;
            statTag.innerText = "OVERRIDE ACTIVE";
            statTag.className = ""; 
            statTag.style.color = "var(--neon-magenta)";
            statDot.style.background = "var(--neon-magenta)";
            statDot.style.boxShadow = "0 0 10px var(--neon-magenta)";

            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=${w}&height=${h}&nologo=true&seed=${Math.random()}`;
            
            update(url, p);
            document.getElementById('prompt-in').value = "";

            // Create Upgraded Gallery Component
            const wrapper = document.createElement('div');
            wrapper.className = 'thumb-wrapper';
            
            const t = document.createElement('img');
            t.src = url; 
            t.className = 'thumb';
            
            const overlay = document.createElement('div');
            overlay.className = 'thumb-overlay';
            overlay.innerHTML = '<span>▲ WIDE</span>';

            wrapper.appendChild(t);
            wrapper.appendChild(overlay);

            // Left clicking background streams back onto monitor setup
            wrapper.onclick = (e) => {
                update(url, p);
            };

            // Overlay targets lightbox magnification engine
            overlay.onclick = (e) => { 
                e.stopPropagation(); 
                lbImg.src = url; 
                lightbox.style.display = 'flex'; 
            };

            gallery.prepend(wrapper);

            setTimeout(() => {
                focusActive = false;
                statTag.innerText = "LIVE_FEED_SYNC";
                statTag.className = "active-sync";
                statTag.style.color = "var(--neon-cyan)";
                statDot.style.background = "var(--neon-cyan)";
                statDot.style.boxShadow = "0 0 10px var(--neon-cyan)";
            }, 12000);
        }

        connect();
    </script>
</body>
</html>
